<!DOCTYPE html>
<html>
<head>
    <title>SafePath Evacuation Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100vw; background: #1a1a1a; }
        .leaflet-container { background: #1a1a1a; }

        #routePanel {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 14px 16px;
            z-index: 1000;
            font-family: sans-serif;
        }
        #routePanel h4 { margin: 0 0 4px 0; color: #22C55E; font-size: 15px; }
        #routePanel p  { margin: 0; color: #9CA3AF; font-size: 13px; }
        #closeRoute {
            position: absolute; top: 10px; right: 14px;
            background: none; border: none; color: #fff;
            font-size: 20px; cursor: pointer;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="routePanel">
    <button id="closeRoute">✕</button>
    <h4 id="routeName">Navigating to shelter</h4>
    <p id="routeInfo">Calculating route...</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([7.8731, 80.7718], 7);

    L.control.zoom({
        position: 'bottomright'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20
    }).addTo(map);

    var alertMarkers  = [];
    var shelterMarkers = [];
    var routeLayer    = null;
    var userMarker    = null;
    var userLat       = null;
    var userLng       = null;

    // ── called by Android after it has GPS coords ──────────────────────────
    window.setUserLocation = function(lat, lng) {
        userLat = lat;
        userLng = lng;

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker([lat, lng], {
            radius: 8,
            fillColor: '#3B82F6',
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map).bindPopup('<b>Your Location</b>');
    };

    // ── alert markers ───────────────────────────────────────────────────────
    window.addAlertMarker = function(lat, lng, type, severity, district, description) {
        var color = severity === 'CRITICAL' ? '#8B0000' :
                    severity === 'HIGH'     ? '#EF4444' :
                    severity === 'MODERATE' ? '#F0A500' : '#22C55E';

        var marker = L.circleMarker([lat, lng], {
            radius: 10,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(
            '<div style="font-family:sans-serif">' +
            '<b style="color:' + color + '">' + type + '</b>' +
            '<br><span style="color:#aaa">Severity: ' + severity + '</span>' +
            '<br><span style="color:#aaa">District: ' + district + '</span>' +
            (description ? '<br><span style="color:#ccc">' + description + '</span>' : '') +
            '</div>'
        );
        alertMarkers.push(marker);
    };

    // ── shelter markers ─────────────────────────────────────────────────────
    window.addShelterMarker = function(lat, lng, name) {
        var marker = L.circleMarker([lat, lng], {
            radius: 9,
            fillColor: '#22C55E', // Green for safe places
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(buildShelterPopup(lat, lng, name));
        shelterMarkers.push(marker);
    };

    function buildShelterPopup(lat, lng, name) {
        var safeName = name ? name.replace(/['"]/g, "") : "Shelter";
        return '<div style="font-family:sans-serif;min-width:150px">' +
               '<b style="color:#22C55E">' + safeName + '</b><br>' +
               '<button onclick="routeToShelter(' + lat + ',' + lng + ',\'' + safeName + '\')" ' +
               'style="background:#22C55E;color:#fff;border:none;border-radius:8px;' +
               'padding:7px 12px;width:100%;margin-top:8px;cursor:pointer;font-size:13px;font-weight:bold">' +
               '🧭 Navigate Here</button></div>';
    }

    // ── in-app routing via OSRM (Now routes to Google Maps) ──
    window.routeToShelter = function(destLat, destLng, name) {
        if (window.SafePathBridge) {
            window.SafePathBridge.openGoogleMaps(destLat, destLng, name);
        }
    };

    document.getElementById('closeRoute').onclick = function() {
        document.getElementById('routePanel').style.display = 'none';
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    };

    // ── clear hazard markers only (keep user blue dot) ─────────────────────
    window.clearHazardMarkers = function() {
        alertMarkers.forEach(function(m)  { map.removeLayer(m); });
        shelterMarkers.forEach(function(m) { map.removeLayer(m); });
        alertMarkers  = [];
        shelterMarkers = [];
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        document.getElementById('routePanel').style.display = 'none';
    };

    // Back-compat
    window.clearAllMarkers = window.clearHazardMarkers;

    // ── fit alerts ──────────────────────────────────────────────────────────
    window.fitAlerts = function() {
        var layers = alertMarkers.concat(shelterMarkers);
        if (userMarker) layers = layers.concat([userMarker]);
        if (layers.length > 0) {
            var group = new L.featureGroup(layers);
            map.fitBounds(group.getBounds(), {padding: [40, 40], maxZoom: 11});
        }
    };

    // ── signal Android: map ready ───────────────────────────────────────────
    function notifyReady() {
        if (window.SafePathBridge) {
            window.SafePathBridge.onMapReady();
        }
    }
    map.whenReady(function() {
        notifyReady();
        // Retry once in case the bridge attached slightly later
        setTimeout(notifyReady, 300);
    });
</script>
</body>
</html>
